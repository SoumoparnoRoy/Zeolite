appId: com.soumoparno.zeolite
name: Sign in and sync to the account
env:
  PROJECT: ${MAESTRO_FIREBASE_PROJECT || 'zeolite-app'}
---
- runScript:
    file: scripts/seed_account.js
    env:
      EMAIL: ${MAESTRO_TEST_EMAIL}
      PASSWORD: ${MAESTRO_TEST_PASSWORD}
- runFlow: subflows/launch.yaml
- runFlow: subflows/sign_out_if_needed.yaml
- runFlow: subflows/open_account.yaml

- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "That does not look like an email address.|That did not work. Try again."
    timeout: 12000
- tapOn:
    id: "auth-email"
- inputText: "not-an-email"
- tapOn:
    id: "auth-password"
- inputText: "wrong-password"
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "That does not look like an email address.|That email and password do not match."
    timeout: 12000
- tapOn:
    id: "auth-email"
- eraseText
- inputText: ${MAESTRO_TEST_EMAIL}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "That email and password do not match."
    timeout: 12000

# A fresh start empties the form; erasing a password field leaves a character.
- stopApp
- runFlow: subflows/launch.yaml
- runFlow: subflows/open_account.yaml
- tapOn:
    id: "auth-email"
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn:
    id: "auth-password"
- inputText: ${MAESTRO_TEST_PASSWORD}
- hideKeyboard
- doubleTapOn: "Sign in"
- extendedWaitUntil:
    visible: "SIGNED IN AS.*"
    timeout: 15000

- scrollUntilVisible:
    element: "Sync now\n.*"
- tapOn: "Sync now\n.*"
- extendedWaitUntil:
    visible: ".*Synced .* sent.*"
    timeout: 60000
- runScript:
    file: scripts/account_rows.js
    env:
      UID: ${output.uid}
- assertTrue: ${output.subjects > 0}
- assertTrue: ${output.accounts == 1}

- stopApp
- runFlow: subflows/launch.yaml
- runFlow: subflows/open_account.yaml
- assertVisible: "SIGNED IN AS.*"
- scrollUntilVisible:
    element:
      id: "sign-out"
- tapOn:
    id: "sign-out"
- assertVisible: "Sign in"
