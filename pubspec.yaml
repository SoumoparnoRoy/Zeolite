name: zeolite
description: "Zeolite - track your university classes and attendance."
publish_to: 'none'
version: 1.0.0+1

# Verified against pub.dev on 11 Aug 2026. flutter_local_notifications 22.x
# requires Flutter 3.38.1+, which sets the floor for the whole project.
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.2

  # Local database
  sqflite: ^2.4.3
  path: ^1.9.0
  path_provider: ^2.1.6

  # Settings
  shared_preferences: ^2.5.5

  # Notifications
  flutter_local_notifications: ^22.3.0
  # The local IANA zone is resolved from this database directly (see
  # NotificationService._resolveLocalLocation) rather than via a platform
  # plugin, which keeps the Kotlin Gradle Plugin out of the build.
  timezone: ^0.11.1
  file_picker: ^12.0.0
  google_mlkit_text_recognition: ^0.17.1
  # A folder for the automatic backup has to outlive the dialog that chose it,
  # which is a persisted SAF grant — file_picker hands back a path, not a tree
  # URI it can take permission on. Neither package declares a permission.
  saf_util: ^3.1.0
  saf_stream: ^4.0.1
  # A Notion export arrives as a zip holding another zip, which no phone file
  # manager opens comfortably. Pure Dart, MIT.
  archive: ^4.2.0
  # Both already arrive under Firebase. Named here because the Notion connect
  # flow imports them directly, and a dependency nobody declared is one a
  # Firebase bump can drop without warning.
  http: ^1.6.0
  crypto: ^3.0.7
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0
  # Not imported from Dart: the Android SDK auto-collects opens, sessions and
  # engagement on its own, which is the whole reason it is here. The ad-ID half
  # is switched off in the manifest, so this reports usage without an
  # advertising identifier.
  firebase_analytics: ^12.5.0
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Rerun `dart run flutter_launcher_icons` after changing anything in
  # assets/icon.
  flutter_launcher_icons: ^0.14.4
  # Runs the real SQLite on the desktop so migrations can be tested rather than
  # only seen to work on the tablet. Test-only: nothing imports it from lib/.
  sqflite_common_ffi: ^2.3.6
  # Already present transitively; declared so the backup test can swap in the
  # in-memory store, since SettingsService uses the async prefs API.
  shared_preferences_platform_interface: ^2.4.1
  fake_cloud_firestore: ^4.2.0
  # Transitive under flutter_secure_storage; declared so the connection store
  # test can swap in the in-memory platform the package ships.
  flutter_secure_storage_platform_interface: ^2.0.3
  # Also already transitive; declared so the sync scheduler's debounce can be
  # tested by moving the clock rather than by sleeping for fifteen seconds.
  fake_async: ^1.3.3

# The source layers stay out of `flutter: assets:`: they feed the generator,
# and bundling them would put a megabyte of PNG in the APK for nothing.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/zeolite_icon.png
  adaptive_icon_background: "#F3F1FF"
  adaptive_icon_foreground: assets/icon/zeolite_icon_foreground.png
  # Below 26 there is no adaptive icon, so the legacy bitmap still gets built.
  min_sdk_android: 24

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/PlusJakartaSans-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt

  # Bundled rather than fetched. Release builds carry no INTERNET permission,
  # so anything downloaded at runtime would silently fall back to Roboto on a
  # store build while looking correct in debug. Both families are SIL OFL; the
  # licence texts ride along as assets and are registered in main().
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
