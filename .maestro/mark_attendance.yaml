appId: com.soumoparno.zeolite
name: Mark attendance on Today
tags:
  - tablet
---
- runFlow: subflows/launch.yaml
- runFlow: subflows/remove_leftover_fixture.yaml
- runFlow: subflows/add_fixture_class.yaml

- assertVisible:
    text: "Present"
    below: ".*Regression Subject\n(NEXT\n|NOW\n)?One-off.*"

# Tapping the current status clears it, so a double tap that counted twice
# would leave the class unmarked.
- doubleTapOn:
    text: "Present"
    below: ".*Regression Subject\n(NEXT\n|NOW\n)?One-off.*"
- stopApp
- runFlow: subflows/launch.yaml
- assertVisible: ".*Regression Subject\n(NEXT\n|NOW\n)?One-off.*Marked present.*"

- tapOn: ".*Regression Subject\n(NEXT\n|NOW\n)?One-off.*Marked present.*"
- tapOn:
    text: "Present"
    below: ".*Regression Subject\n(NEXT\n|NOW\n)?One-off.*"
- assertNotVisible: ".*Regression Subject\n(NEXT\n|NOW\n)?One-off.*Marked present.*"
- tapOn:
    text: "Absent"
    below: ".*Regression Subject\n(NEXT\n|NOW\n)?One-off.*"
- stopApp
- runFlow: subflows/launch.yaml
- assertVisible: ".*Regression Subject\n(NEXT\n|NOW\n)?One-off.*Marked absent.*"

- runFlow: subflows/delete_fixture.yaml
